name: Priority observation regression
on:
  push:
    branches: [fix/priority-observation-identity]
  pull_request:
    paths:
      - 'backend/internal/service/priority*'
      - 'backend/internal/service/openai_account_scheduler.go'
      - 'backend/internal/handler/*observation*'
      - 'backend/internal/handler/openai_gateway_handler.go'
      - 'backend/internal/handler/openai_chat_completions.go'
      - 'backend/internal/repository/priority_scheduling*'
      - 'frontend/src/views/admin/PrioritySchedulingView.vue'
      - 'frontend/src/views/admin/__tests__/PrioritySchedulingView.spec.ts'
      - '.github/workflows/priority-observation.yml'
      - '.github/scripts/priority-observation-red.py'
permissions:
  contents: read
jobs:
  seams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Old production functions must fail behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/priority-logs"
          python3 .github/scripts/priority-observation-red.py
          set +e
          (cd backend && go test -tags=unit ./internal/service ./internal/handler -run '^TestPriorityObservation(ResponsesEndpoint|PublicHistoryModel|MappedBodyNormalization)$' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/priority-logs/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/priority-logs/red.log"
          git restore backend/internal/service/priority_error_rate.go backend/internal/service/priority_scheduling_history.go backend/internal/handler/openai_gateway_handler.go
          test "$result" -ne 0
          for name in ResponsesEndpoint PublicHistoryModel MappedBodyNormalization; do
            grep -q -- "--- FAIL: TestPriorityObservation$name" "$RUNNER_TEMP/priority-logs/red.log"
          done
          if grep -Eq 'build failed|undefined:|syntax error' "$RUNNER_TEMP/priority-logs/red.log"; then exit 1; fi
      - name: New transport scheduler history and handler seams
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -tags=unit ./internal/service ./internal/handler -run '^(TestPriority|TestOpenAI.*Sticky|Test.*PreviousResponse)' -count=1 -v -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/green.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: priority-seams-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/priority-logs
          if-no-files-found: error
